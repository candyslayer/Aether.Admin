services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aether_admin
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  api:
    build: .
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ConnectionStrings__Database: Host=postgres;Database=aether_admin;Username=aether;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY to at least 32 bytes}
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
